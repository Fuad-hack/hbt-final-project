<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ITDT - Insider Threat Detection System">
  <title>ITDT | Sign In</title>
  <link rel="stylesheet" href="/static/css/login.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
</head>
<body>
  <!-- Animated Grid Background -->
  <div class="bg-dots"></div>
  
  <div class="login-wrapper">
    <!-- Logo Above Card -->
    <div class="login-brand">
      <h1 class="brand-name">ITDT</h1>
    </div>
    
    <!-- Main Login Card -->
    <div class="login-box">
      <!-- Header -->
      <div class="login-header">
        <h2 class="login-title">Sign In</h2>
        <button type="button" class="theme-toggle" title="Toggle theme">
          <i class="fas fa-sun"></i>
        </button>
      </div>
      
      <!-- Login Form -->
      <form class="login-form" id="loginForm">
        <div class="form-field">
          <label class="field-label" for="login-username">Username</label>
          <div class="field-input">
            <input 
              type="text" 
              id="login-username" 
              name="username" 
              placeholder="Enter your username"
              autocomplete="username"
              required
            >
          </div>
        </div>
        
        <div class="form-field">
          <label class="field-label" for="login-password">Password</label>
          <div class="field-input">
            <input 
              type="password" 
              id="login-password" 
              name="password" 
              placeholder="Enter your password"
              autocomplete="current-password"
              required
            >
            <button type="button" class="toggle-password" id="togglePassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        
        <button type="submit" class="btn-login" id="loginBtn">
          <span class="btn-text">Log In</span>
          <span class="btn-loader">
            <i class="fas fa-circle-notch fa-spin"></i>
          </span>
        </button>
      </form>
      
      <!-- Sign Up Link -->
      <div class="signup-link">
        <span>Need to create an account?</span>
        <a href="#" id="showRegister">Sign Up</a>
      </div>
      
      <!-- Messages -->
      <div class="alert alert-error" id="errorMessage" style="display: none;">
        <i class="fas fa-exclamation-circle"></i>
        <span id="errorText"></span>
      </div>
      
      <div class="alert alert-success" id="successMessage" style="display: none;">
        <i class="fas fa-check-circle"></i>
        <span id="successText"></span>
      </div>
    </div>
    
    <!-- Register Card (Hidden by default) -->
    <div class="login-box" id="registerBox" style="display: none;">
      <div class="login-header">
        <h2 class="login-title">Sign Up</h2>
        <button type="button" class="theme-toggle" id="themeToggle" title="Toggle theme">
          <i class="fas fa-sun"></i>
        </button>
      </div>
      
      <form class="login-form" id="registerForm">
        <div class="form-field">
          <label class="field-label" for="reg-name">Name <span class="required">*</span></label>
          <div class="field-input">
            <input 
              type="text" 
              id="reg-name" 
              name="name" 
              placeholder="Enter your name"
              autocomplete="name"
              required
            >
          </div>
        </div>
        
        <div class="form-field">
          <label class="field-label" for="reg-company">Company Name</label>
          <div class="field-input">
            <input 
              type="text" 
              id="reg-company" 
              name="company" 
              placeholder="Enter company name"
              autocomplete="organization"
            >
          </div>
        </div>
        
        <div class="form-field">
          <label class="field-label" for="reg-email">Email <span class="required">*</span></label>
          <div class="field-input">
            <input 
              type="email" 
              id="reg-email" 
              name="email" 
              placeholder="Enter your email"
              autocomplete="email"
              required
            >
          </div>
        </div>
        
        <div class="form-field">
          <label class="field-label" for="reg-password">Password <span class="required">*</span></label>
          <div class="field-input">
            <input 
              type="password" 
              id="reg-password" 
              name="password" 
              placeholder="Create password"
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-password" id="toggleRegPassword">
              <i class="fas fa-eye"></i>
            </button>
          </div>
          <div class="password-meter" id="passwordMeter"></div>
        </div>
        
        <div class="form-field">
          <label class="field-label" for="reg-confirm">Confirm Password <span class="required">*</span></label>
          <div class="field-input">
            <input 
              type="password" 
              id="reg-confirm" 
              name="confirm" 
              placeholder="Confirm password"
              autocomplete="new-password"
              required
            >
            <button type="button" class="toggle-password" id="toggleRegConfirm">
              <i class="fas fa-eye"></i>
            </button>
          </div>
        </div>
        
        <div class="form-field checkbox-field">
          <label class="checkbox-label">
            <input type="checkbox" id="agreeTerms" name="agree_terms" required>
            <span class="checkbox-text">I agree with the <a href="#">Terms</a> and <a href="#">Privacy Policy</a></span>
          </label>
        </div>
        
        <button type="submit" class="btn-login btn-green" id="registerBtn">
          <span class="btn-text">Sign Up</span>
          <span class="btn-loader">
            <i class="fas fa-circle-notch fa-spin"></i>
          </span>
        </button>
        
        <div class="login-link">
          <span>Already have an account?</span>
          <a href="#" id="showLogin">Log In</a>
        </div>
      </form>
    </div>
    
    <!-- Footer -->
    <div class="login-footer">
      <span class="footer-text">2024 Insider Threat Detection. All rights reserved.</span>
    </div>
  </div>
  
  <script src="/static/js/login.js"></script>
</body>
</html>
